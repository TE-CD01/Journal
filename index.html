<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Offline Trading Journal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d1117; --card: #161b22; --primary: #10b981; --danger: #f85149; --border: #30363d; --text: #c9d1d9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Dashboard Layout */
        .dashboard-header { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-container { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid var(--border); height: 300px; }
        .stats-side { display: flex; flex-direction: column; gap: 15px; }
        .mini-stat { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .stat-val { font-family: 'Lexend'; font-size: 28px; font-weight: 700; color: #fff; }

        /* Form Section */
        .entry-box { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 30px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
        input, select, button { background: #010409; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; }
        .btn-add { background: var(--primary); border: none; font-weight: 700; cursor: pointer; height: 100%; }

        /* Trade Cards */
        .trade-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .trade-card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; position: relative; }
        .trade-img { width: 100%; height: 180px; object-fit: cover; background: #000; cursor: pointer; }
        .card-content { padding: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px; }
        .price-info { display: flex; gap: 15px; font-size: 13px; color: #8b949e; margin: 10px 0; }
        .win-label { color: var(--primary); font-weight: 700; }
        .loss-label { color: var(--danger); font-weight: 700; }

        /* File Actions */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .file-btn { background: #21262d; border: 1px solid var(--border); color: #fff; padding: 8px 15px; cursor: pointer; font-size: 13px; border-radius: 6px; }

        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h1 style="font-family: 'Lexend'; margin: 0;">Trading <span style="color:var(--primary)">Journal</span> Pro</h1>
        <div style="display:flex; gap:10px;">
            <button class="file-btn" onclick="exportData()">💾 Save JSON</button>
            <button class="file-btn" onclick="document.getElementById('fin').click()">📂 Load File</button>
            <input type="file" id="fin" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <div class="dashboard-header">
        <div class="chart-container">
            <canvas id="equityChart"></canvas>
        </div>
        <div class="stats-side">
            <div class="mini-stat"><div>Win Rate</div><div id="wr" class="stat-val">0%</div></div>
            <div class="mini-stat"><div>Net Profit</div><div id="net" class="stat-val">$0</div></div>
        </div>
    </div>

    <div class="entry-box">
        <div class="form-row">
            <div>
                <label style="font-size: 12px;">Asset (Searchable)</label>
                <input list="assets" id="pair" placeholder="e.g. BTC/USDT">
                <datalist id="assets">
                    <option value="BTC/USDT"> <option value="ETH/USDT"> <option value="XAU/USD"> <option value="XRP/USDT"> <option value="SOL/USDT"> <option value="EUR/USD">
                </datalist>
            </div>
            <div>
                <label style="font-size: 12px;">Entry Price</label>
                <input type="number" id="entryPrice" placeholder="0.00">
            </div>
            <div>
                <label style="font-size: 12px;">Exit Price</label>
                <input type="number" id="exitPrice" placeholder="0.00">
            </div>
            <div>
                <label style="font-size: 12px;">PnL ($)</label>
                <input type="number" id="pnl" placeholder="Amount">
            </div>
        </div>
        <div class="form-row">
            <input type="date" id="date">
            <input type="text" id="setup" placeholder="Strategy Name">
            <input type="file" id="imgIn" accept="image/*" onchange="readImg(event)">
            <button class="btn-add" onclick="addTrade()">🚀 Add Trade</button>
        </div>
    </div>

    <div class="trade-grid" id="tradeList"></div>
</div>

<div id="modal" onclick="this.style.display='none'"><img id="mImg" style="max-width:90%; max-height:90%;"></div>

<script>
    let trades = [];
    let tempImg = "";
    let chart;

    function initChart() {
        const ctx = document.getElementById('equityChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: [0], datasets: [{ label: 'Equity Curve ($)', data: [0], borderColor: '#10b981', tension: 0.3, fill: true, backgroundColor: 'rgba(16,185,129,0.1)' }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#30363d' } }, x: { grid: { display: false } } } }
        });
    }

    function readImg(e) {
        const reader = new FileReader();
        reader.onload = (ev) => tempImg = ev.target.result;
        reader.readAsDataURL(e.target.files[0]);
    }

    function addTrade() {
        const t = {
            id: Date.now(),
            pair: document.getElementById('pair').value.toUpperCase(),
            entry: document.getElementById('entryPrice').value,
            exit: document.getElementById('exitPrice').value,
            pnl: parseFloat(document.getElementById('pnl').value) || 0,
            date: document.getElementById('date').value,
            setup: document.getElementById('setup').value,
            img: tempImg
        };
        if(!t.pair || !t.date) return alert("กรุณาระบุคู่เงินและวันที่");
        trades.push(t);
        updateUI();
        // Reset
        tempImg = ""; document.getElementById('imgIn').value = "";
    }

    function updateUI() {
        renderCards();
        updateStatsAndChart();
    }

    function updateStatsAndChart() {
        let currentEquity = 0;
        let equityData = [0];
        let labels = [0];
        let wins = 0;

        trades.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach((t, i) => {
            currentEquity += t.pnl;
            equityData.push(currentEquity);
            labels.push(i + 1);
            if(t.pnl > 0) wins++;
        });

        chart.data.labels = labels;
        chart.data.datasets[0].data = equityData;
        chart.update();

        document.getElementById('wr').innerText = trades.length > 0 ? ((wins/trades.length)*100).toFixed(1) + "%" : "0%";
        document.getElementById('net').innerText = "$" + currentEquity.toLocaleString();
        document.getElementById('net').style.color = currentEquity >= 0 ? "#10b981" : "#f85149";
    }

    function renderCards() {
        const container = document.getElementById('tradeList');
        container.innerHTML = [...trades].reverse().map(t => `
            <div class="trade-card">
                <img src="${t.img || 'https://via.placeholder.com/400x200/161B22/30363D?text=No+Screenshot'}" class="trade-img" onclick="zoom('${t.img}')">
                <div class="card-content">
                    <div class="card-header">
                        <div><strong>${t.pair}</strong><br><small>${t.date}</small></div>
                        <span style="font-size:12px; background:#21262d; padding:3px 8px; border-radius:4px;">${t.setup}</span>
                    </div>
                    <div class="price-info">
                        <span>IN: <b>${t.entry || '-'}</b></span>
                        <span>OUT: <b>${t.exit || '-'}</b></span>
                    </div>
                    <div class="pnl-value ${t.pnl >= 0 ? 'win-label' : 'loss-label'}">
                        PnL: $${t.pnl.toLocaleString()}
                    </div>
                    <button onclick="del(${t.id})" style="background:none; border:none; color:#8b949e; cursor:pointer; font-size:11px; margin-top:10px; width:auto; padding:0;">Delete</button>
                </div>
            </div>
        `).join('');
    }

    function zoom(s) { if(s){ document.getElementById('modal').style.display='flex'; document.getElementById('mImg').src=s; } }
    function del(id) { trades = trades.filter(t => t.id !== id); updateUI(); }
    
    function exportData() {
        const blob = new Blob([JSON.stringify(trades)], {type: "application/json"});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `TradeLog_${new Date().toISOString().slice(0,10)}.json`; a.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => { trades = JSON.parse(ev.target.result); updateUI(); };
        reader.readAsText(e.target.files[0]);
    }

    window.onload = initChart;
</script>
</body>
</html>
