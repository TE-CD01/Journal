<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Professional Trading Journal - Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0C10;
            --card-bg: #161B22;
            --primary: #10B981; /* Green */
            --danger: #EF4444; /* Red */
            --accent: #3B82F6; /* Blue */
            --text-main: #F0F6FC;
            --text-dim: #8B949E;
            --border: #30363D;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
        }

        .container { max-width: 1200px; margin: auto; }

        /* Header & Dashboard Stats */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }
        .stat-card h3 { color: var(--text-dim); font-size: 14px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .value { font-family: 'Lexend'; font-size: 36px; font-weight: 700; }

        /* Form Styling */
        .input-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 50px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        input, select, button {
            background: #0D1117;
            border: 1px solid var(--border);
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 15px;
        }
        .btn-add { background: var(--primary); font-weight: 700; cursor: pointer; border: none; grid-column: span 1; }
        .btn-add:hover { filter: brightness(1.2); }

        /* Trade Log Layout (คล้าย Notion ในรูป) */
        .section-title { font-family: 'Lexend'; font-size: 24px; margin-bottom: 20px; border-left: 5px solid var(--primary); padding-left: 15px; }
        
        .trade-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        .trade-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .trade-card:hover { transform: translateY(-5px); border-color: var(--text-dim); }
        .trade-img { width: 100%; height: 200px; object-fit: cover; background: #000; border-bottom: 1px solid var(--border); cursor: zoom-in; }
        
        .trade-details { padding: 20px; }
        .trade-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.1); }
        
        .pnl-value { font-size: 20px; font-weight: 700; margin-top: 10px; }
        .win { color: var(--primary); }
        .loss { color: var(--danger); }

        /* Actions */
        .file-actions { display: flex; gap: 10px; }
        .btn-file { background: #30363D; font-size: 13px; cursor: pointer; }

        /* Modal */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        #modal img { max-width: 95%; max-height: 90%; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="font-family: 'Lexend';">Professional <span style="color:var(--primary)">Journal</span></h1>
        <div class="file-actions">
            <button class="btn-file" onclick="exportJSON()">💾 Export JSON</button>
            <button class="btn-file" onclick="document.getElementById('fIn').click()">📂 Import JSON</button>
            <input type="file" id="fIn" style="display:none" accept=".json" onchange="importJSON(event)">
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card"><h3>Win Rate</h3><div id="wr" class="value win">0%</div></div>
        <div class="stat-card"><h3>Total P/L</h3><div id="totalPL" class="value">$0</div></div>
        <div class="stat-card"><h3>Total Trades</h3><div id="count" class="value">0</div></div>
    </div>

    <div class="input-section">
        <div class="form-grid">
            <input type="date" id="date">
            <input type="text" id="pair" placeholder="Asset (e.g. BTC/USD)">
            <select id="status">
                <option value="Win">Win ✅</option>
                <option value="Loss">Loss ❌</option>
            </select>
            <input type="number" id="pnl" placeholder="PnL Amount ($)">
            <input type="text" id="setup" placeholder="Strategy / Setup Name">
            <input type="file" id="imgIn" accept="image/*" onchange="handleImg(event)">
            <button class="btn-add" onclick="addEntry()">Add New Trade</button>
        </div>
        <p id="imgStatus" style="font-size: 12px; color: var(--text-dim); margin-top: 10px;"></p>
    </div>

    <h2 class="section-title">Trade Logs & Strategy Analysis</h2>
    <div id="tradeList" class="trade-list"></div>
</div>

<div id="modal" onclick="this.style.display='none'"><img id="mImg"></div>

<script>
    let trades = [];
    let tempImg = "";

    function handleImg(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            tempImg = event.target.result;
            document.getElementById('imgStatus').innerText = "✅ Image Loaded";
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function addEntry() {
        const trade = {
            id: Date.now(),
            date: document.getElementById('date').value,
            pair: document.getElementById('pair').value.toUpperCase(),
            status: document.getElementById('status').value,
            pnl: parseFloat(document.getElementById('pnl').value) || 0,
            setup: document.getElementById('setup').value || "No Setup",
            image: tempImg
        };

        if(!trade.date || !trade.pair) return alert("Please fill at least Date and Pair.");

        trades.unshift(trade);
        updateAll();
        // Reset
        tempImg = "";
        document.getElementById('imgStatus').innerText = "";
        document.getElementById('imgIn').value = "";
    }

    function updateAll() {
        renderList();
        calcStats();
    }

    function calcStats() {
        const total = trades.length;
        const wins = trades.filter(t => t.status === 'Win').length;
        const netPL = trades.reduce((sum, t) => sum + t.pnl, 0);

        document.getElementById('wr').innerText = total > 0 ? ((wins/total)*100).toFixed(1) + "%" : "0%";
        document.getElementById('totalPL').innerText = "$" + netPL.toLocaleString();
        document.getElementById('totalPL').className = netPL >= 0 ? "value win" : "value loss";
        document.getElementById('count').innerText = total;
    }

    function renderList() {
        const list = document.getElementById('tradeList');
        list.innerHTML = trades.map(t => `
            <div class="trade-card">
                <img src="${t.image || 'https://via.placeholder.com/400x200/161B22/8B949E?text=No+Screenshot'}" 
                     class="trade-img" onclick="zoom('${t.image}')">
                <div class="trade-details">
                    <div class="trade-top">
                        <div>
                            <div style="font-size: 12px; color: var(--text-dim);">${t.date}</div>
                            <div style="font-size: 18px; font-weight: 700;">${t.pair}</div>
                        </div>
                        <span class="badge">${t.setup}</span>
                    </div>
                    <div class="pnl-value ${t.pnl >= 0 ? 'win' : 'loss'}">
                        ${t.status} : $${t.pnl.toLocaleString()}
                    </div>
                    <button onclick="del(${t.id})" style="background:none; border:none; color:var(--text-dim); cursor:pointer; margin-top:15px; font-size:12px;">Delete Trade</button>
                </div>
            </div>
        `).join('');
    }

    function zoom(src) { if(src) { document.getElementById('modal').style.display='flex'; document.getElementById('mImg').src=src; } }
    function del(id) { trades = trades.filter(t => t.id !== id); updateAll(); }

    function exportJSON() {
        const data = JSON.stringify(trades);
        const blob = new Blob([data], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Trading_Journal_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function importJSON(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            trades = JSON.parse(event.target.result);
            updateAll();
        };
        reader.readAsText(e.target.files[0]);
    }
</script>

</body>
</html>
